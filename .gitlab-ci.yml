stages:
    - check
    - publish


default:
    image: python:3.14


variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"


cache:
    key:
        files:
            - uv.lock
    paths:
        - .cache/uv/


# ---------------------------------------------------------------------------
.quality:
    stage: check

    before_script:
        - python -m pip install --upgrade uv
        - uv sync --locked

    script:
        - uv run pre-commit run --all-files
        - >
            uv run pytest
            --cov=ox_orch
            --cov-report=term-missing
            --cov-report=xml:coverage.xml
            --cov-report=html:coverage

    coverage: '/TOTAL.*\s+(\d+(?:\.\d+)?)%/'

    artifacts:
        when: always
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
        paths:
            - coverage.xml
            - coverage/


# ---------------------------------------------------------------------------
# Merge requests

mr:quality:
    extends:
        - .quality

    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Version tags
tag:quality:
    extends:
        - .quality

    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([.-].*)?$/'

# Package publication
package:
    stage: publish

    needs:
        - tag:quality

    before_script:
        - python -m pip install --upgrade uv
        - uv sync --locked

    script:
        - uv build
        - uv publish

    rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([.-].*)?$/'
